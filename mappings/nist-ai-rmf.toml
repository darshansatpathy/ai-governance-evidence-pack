# Mappings for nist-ai-rmf. Every control has exactly one mapping. Statuses are conservative; see docs/method.md.
framework = "nist-ai-rmf"

[[mapping]]
control = "NIST-GV-1.4"
status = "partial"
reviewed = 2026-11-13
rationale = "Policies are expressed as checked code in several places: architecture fitness functions, Terraform policy rules, lakehouse lint rules, tool-boundary policy files and approval policy data, each with tests."
limits = "Policy-as-code covers technical controls for these reference systems. There is no organisation-level AI risk policy or statement of risk priorities."
owner = "AI governance lead"
next_step = "Write the organisation-level AI risk policy and link each technical rule set to it."

[[mapping.evidence]]
repo = "ai-platform-reference-architecture"
path = "src/archfit/rules.py"
kind = "code"
contains = "FIT002"
shows = "Architecture fitness functions that fail a design change when a component breaks a stated rule."

[[mapping.evidence]]
repo = "azure-ai-landing-zone"
path = "src/tfpolicy/rules.py"
kind = "code"
contains = "TFP016"
shows = "A policy rule fails Terraform that deploys a model without naming a content filter policy; neighbouring rules require private access and keyless authentication."

[[mapping.evidence]]
repo = "databricks-medallion-lakehouse"
path = "src/medallion/policy.py"
kind = "code"
contains = "MED007"
shows = "A lint rule fails the build when a personal-data column lacks a mask or a derived column copies the raw value."

[[mapping.evidence]]
repo = "agent-guardrails-gateway"
path = "policies/support-agent.yaml"
kind = "config"
contains = "Anything not listed here is denied."
shows = "A default-deny tool policy with risk levels, untrusted-output and egress markers, and a maximum grant lifetime."

[[mapping.evidence]]
repo = "ai-platform-reference-architecture"
path = "docs/operating-model.md"
kind = "doc"
contains = "Responsibilities (RACI)"
shows = "A responsibility matrix, change classes, an onboarding path for new use cases, a governance cadence and a waiver process."

