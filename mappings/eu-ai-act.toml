# Mappings for eu-ai-act. Every control has exactly one mapping. Statuses are conservative; see docs/method.md.
framework = "eu-ai-act"

[[mapping]]
control = "EUAIA-04"
status = "organisational"
reviewed = 2026-11-13
rationale = "Literacy measures are about people: who is trained, on what, and how that is recorded. No repository can show it."
owner = "AI governance lead"
next_step = "Define role-based AI literacy measures for staff who operate or oversee AI systems and record completion."

[[mapping]]
control = "EUAIA-09"
status = "partial"
reviewed = 2026-11-13
rationale = "Risks are identified, scored, owned and tied to mitigations in the platform risk register, and each reference system carries a threat model with controls and residual risk. These are design-time artefacts for reference systems."
limits = "No lifecycle risk process for a specific deployed system: no testing against foreseeable misuse for a declared purpose, no residual-risk acceptance record, no review trigger on substantial modification."
owner = "Model risk lead"
next_step = "Adopt the risk register as a template for each deployed system, add a residual-risk acceptance step and a review trigger on change."

