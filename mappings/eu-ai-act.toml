[[mapping]]
control = "EUAIA-15"
status = "partial"
reviewed = 2026-11-13
rationale = "The harness has 27 hermetic scenarios for safety properties, hard budgets, bounded retries and credential handling; the evaluation gate blocks regressions using a calibrated judge and a significance test; the landing zone policy checker enforces private access and keyless authentication; the gateway runs an attack corpus in CI."
