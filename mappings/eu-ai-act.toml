[[mapping]]
control = "EUAIA-14"
status = "implemented"
reviewed = 2026-11-13
rationale = "Writes need approval by default across the agent harness and the gateway; the approval service binds an approval to the exact arguments, makes it single use, separates the requester from the approver, supports quorum and veto, and lets an agent cancel its own requests. A scenario shows an injected instruction cannot cause a refund."
limits = "A rubber-stamp approver defeats the control. Nothing here addresses automation bias, training or competence of overseers (Article 14(4)), or a stop control for a whole deployed system."
owner = "Product owner of the deployed system"
next_step = "Show approvers the exact arguments, measure approval time and override rate, train overseers, and document how to halt the system."

[[mapping.evidence]]
repo = "claude-agent-reference"
path = "docs/adr/0003-approval-gated-writes.md"
kind = "doc"
contains = "default approver denies"
shows = "State-changing tools require approval and the default approver denies, so a model fooled by injected text still cannot act."

