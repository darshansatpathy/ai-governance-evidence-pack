[[mapping]]
control = "EUAIA-12"
status = "implemented"
reviewed = 2026-11-13
rationale = "Several reference implementations record events automatically in tamper-evident form: the agent harness (hash-chained, redacted, verifiable), the approval service (hash-chained event log), the gateway (HMAC-chained records) and the data agent (an audit table)."
limits = "Deleting the tail of a hash-chained file is not detectable from the file alone; the latest hash must be stored where the agent cannot write. Retention periods, access to logs and what counts as a relevant event are deployment decisions not made here."
owner = "Platform security lead"
next_step = "In each deployment, anchor the head hash externally, set a retention period, and document which events are recorded for which risk."

