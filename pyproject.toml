[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-governance-evidence-pack"
version = "0.1.0"
description = "AI governance controls from the EU AI Act, NIST AI RMF and ISO/IEC 42001, mapped to checked, hash-pinned evidence in real repositories, with honest gaps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["ai-governance", "eu-ai-act", "nist-ai-rmf", "iso-42001", "evidence", "compliance-as-code", "risk-management"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7", "pyyaml>=6.0"]

[project.scripts]
govpack = "govpack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/govpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "E501"]
"src/govpack/rules.py" = ["E501"]
"src/govpack/render.py" = ["E501"]
"src/govpack/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["govpack"]
